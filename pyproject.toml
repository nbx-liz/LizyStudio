[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lizystudio"
dynamic = ["version"]
description = "Web-based GUI for LizyML"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "nbx" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
]
dependencies = [
    "lizyml[plots,tuning,calibration,explain]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "websockets>=14.0",
]

[project.scripts]
lizystudio = "lizystudio.cli:main"

[project.urls]
Homepage = "https://github.com/nbx-liz/LizyStudio"
Repository = "https://github.com/nbx-liz/LizyStudio"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.28",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/lizystudio/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lizystudio"]
artifacts = ["src/lizystudio/static/**"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "lizyml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
