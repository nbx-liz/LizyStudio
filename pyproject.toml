[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lizystudio"
dynamic = ["version"]
description = "Web-based GUI for LizyML"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "nbx" }]
keywords = ["machine-learning", "gui", "lightgbm", "scikit-learn", "automl", "hyperparameter-tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "lizyml[plots,tuning,calibration,explain]>=0.7.0,<0.10.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "websockets>=14.0",
]

[project.scripts]
lizystudio = "lizystudio.cli:main"

[project.urls]
Homepage = "https://github.com/nbx-liz/LizyStudio"
Repository = "https://github.com/nbx-liz/LizyStudio"
Issues = "https://github.com/nbx-liz/LizyStudio/issues"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.28",
    "pandas-stubs>=2.3.3.260113",
    "types-pyyaml>=6.0.12.20250915",
    "pyarrow>=23.0.1",
    "pre-commit>=4.0",
]

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/lizystudio/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lizystudio"]
artifacts = ["src/lizystudio/static/**"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["src/lizystudio/_version.py"]  # auto-generated by setuptools-scm

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/lizystudio/api/*.py" = ["B008"]  # Depends() in defaults is standard FastAPI
"src/lizystudio/_version.py" = ["UP006", "UP007", "UP035", "I001"]  # auto-generated

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "lizyml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require TestClient/server)",
]
