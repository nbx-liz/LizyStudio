[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lizystudio"
dynamic = ["version"]
description = "Web-based GUI for LizyML"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "nbx" }]
keywords = ["machine-learning", "gui", "lightgbm", "scikit-learn", "automl", "hyperparameter-tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "lizyml[plots,tuning,calibration,explain]>=0.15.0,<0.17.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "websockets>=14.0",
    # H-0062: explicit pin so pickle usage survives a future lizyml
    # dependency refactor. Already in the tree via lizyml.
    "cloudpickle>=3.0",
    # H-0065: Prometheus metrics exposition for /api/metrics.
    "prometheus-client>=0.20",
]

[project.scripts]
lizystudio = "lizystudio.cli:main"

[project.urls]
Homepage = "https://github.com/nbx-liz/LizyStudio"
Repository = "https://github.com/nbx-liz/LizyStudio"
Issues = "https://github.com/nbx-liz/LizyStudio/issues"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-rerunfailures>=14.0",
    # Issue #27 (a) / P-0094: perf-baseline harness; addopts below skip
    # bench files by default so PR CI runtime stays unchanged.
    "pytest-benchmark>=4.0",
    # Issue #539: property-based testing for state machines + config funnel.
    # Pinned major; minor bumps acceptable without re-pinning. Used only
    # in tests/property/ and tests/regression/test_pbt_*.py.
    "hypothesis>=6.0",
    # Issue #539: mutation testing for the JobStore state machine. Runs
    # nightly only — invocation lives in .github/workflows/nightly.yml and
    # is non-blocking (the score is a trend metric, not a PR gate). The
    # ``[tool.mutmut]`` section below scopes the targets.
    "mutmut>=3.0",
    "httpx>=0.28",
    "pandas-stubs>=2.3.3.260113",
    "types-pyyaml>=6.0.12.20250915",
    "pyarrow>=23.0.1",
    "pre-commit>=4.0",
]

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/lizystudio/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lizystudio"]
artifacts = ["src/lizystudio/static/**"]

# sdist must include the pre-built frontend assets (under src/lizystudio/static)
# so that `pip install` from sdist produces a working install without Node.js.
# Everything else (frontend sources, tests, docs, internal planning) is omitted
# to keep the package small and free of repo metadata.
[tool.hatch.build.targets.sdist]
include = [
    "src/lizystudio/**",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
]
exclude = [
    "src/lizystudio/_version.py",  # regenerated by hatch-vcs at build time
    "**/__pycache__",
    "**/*.pyc",
    # Hatch auto-discovers README.md files anywhere in the tree; explicitly
    # drop ones that document repo-internal directories not shipped to PyPI.
    "data/**",
    "frontend/**",
    "tests/**",
    ".gitignore",
]
artifacts = ["src/lizystudio/static/**"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["src/lizystudio/_version.py"]  # auto-generated by setuptools-scm

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/lizystudio/api/*.py" = ["B008"]  # Depends() in defaults is standard FastAPI
"src/lizystudio/server.py" = ["B008"]  # WebSocket handler uses Depends() (A-8)
"src/lizystudio/_version.py" = ["UP006", "UP007", "UP035", "I001"]  # auto-generated

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "lizyml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cloudpickle"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run excludes quarantined tests; CI runs them in a non-blocking
# job (see .github/workflows/ci.yml). Local runs stay retry-free so
# flaky tests remain visible during development — see CLAUDE.md §8.
# ``--benchmark-skip`` keeps tests/bench/ out of the default run so PR CI
# runtime is unchanged (P-0094); the nightly bench job overrides this
# with ``--benchmark-only``.
addopts = "-m 'not quarantine' --benchmark-skip"
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require TestClient/server)",
    "slow: Slow tests that actually train a real model (deselect with -m 'not slow')",
    "flaky: Known-flaky tests — CI reruns via pytest-rerunfailures; local runs do not retry",
    "quarantine: Isolated tests — excluded from default runs, executed in a non-blocking CI job",
    "bench: Performance benchmarks (skipped by default; run with --benchmark-only via the nightly workflow)",
    "pickle_compat: Cross-version pickle compatibility tests (skipped by default; run by the nightly pickle-compat job, v3-26)",
]

# Issue #539: mutmut targets the JobStore state machine first because the
# v0.6.x bug history (#337/#339/#530) is dominated by state/concurrency
# regressions that example-based tests covered structurally but mutation
# tests would have caught at the predicate level. Scope is intentionally
# narrow so the nightly run completes in minutes, not hours.
#
# Mutation score is reported as a trend metric (see
# .github/workflows/nightly.yml::mutation-test). Achieving any specific
# score is NOT a PR gate; tightening per module is a follow-up.
[tool.mutmut]
paths_to_mutate = [
    "src/lizystudio/services/_job_metadata.py",
    "src/lizystudio/services/_job_active_slot.py",
    "src/lizystudio/services/_job_control_flags.py",
]
# Run the matching test suites so a mutation is "killed" by an existing
# regression test failing, not by random luck.
runner = "uv run pytest tests/regression/test_inv_state_machine.py tests/regression/test_inv_pause_keeps_slot.py tests/regression/test_inv_slot_release.py tests/property/test_pbt_job_state_machine.py -x -q --no-cov"
# Mutmut writes its database under ``.mutmut/`` at the repo root; the
# block-stray-artefacts hook treats that prefix as managed (see
# scripts/check_stray.py).
tests_dir = "tests"
