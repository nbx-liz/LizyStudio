name: Bug Report
description: Report a bug in LizyStudio
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.

  - type: dropdown
    id: tier
    attributes:
      label: Tier (estimated fix effort)
      description: |
        Leave as Unknown if not yet investigated.
        Tier 1: <5 min, obvious fix. Tier 2: <30 min, root cause known.
        Tier 3: <1 hour, design judgment needed. Tier 4: >1 hour, multi-file.
      options:
        - "Unknown"
        - "Tier 1: Quick fix (<5 min)"
        - "Tier 2: Small fix (<30 min)"
        - "Tier 3: Medium fix (<1 hour)"
        - "Tier 4: Large fix (>1 hour)"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: LizyStudio version
      description: Run `lizystudio --version` or check `pip show lizystudio`
      placeholder: "0.1.2"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Run `python --version`
      placeholder: "3.11.9"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Workspace
        - Jobs
        - Inference
        - Backend / API
        - Installation / Startup
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: investigation
    attributes:
      label: Investigation notes
      description: |
        What has been tried or explored so far?
        Include failed approaches so the fixer does not repeat them.
        Leave empty if not yet investigated.
      placeholder: |
        - Tried X but failed because Y
        - Root cause appears to be ...
    validations:
      required: false

  - type: textarea
    id: recommended-approach
    attributes:
      label: Recommended fix approach
      description: |
        The most promising fix strategy, if known.
        Be specific enough that someone can start coding immediately.
      placeholder: |
        1. Change X in file A
        2. Add regression test for Y
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste relevant terminal output, browser console errors, or screenshots.
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.2 / Ubuntu 24.04 / Windows 11"
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser (if frontend issue)
      placeholder: "Chrome 131 / Firefox 134 / Safari 18"
    validations:
      required: false
