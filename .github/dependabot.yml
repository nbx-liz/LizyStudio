version: 2
updates:
  # Frontend (npm/pnpm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    # Lowered 5 -> 3: every open PR gets rebased when a sibling merges, and
    # each rebase re-runs the full CI matrix. Measured 2026-07: 27 CI runs
    # came from 16 branches, i.e. ~40% of runner minutes went to rebase
    # churn on PRs waiting in the queue.
    open-pull-requests-limit: 3
    # Delay brand-new releases so breaking patch/minor fixes land upstream first.
    cooldown:
      default-days: 5
      semver-major-days: 14
    ignore:
      # Vite 8 (Rolldown bundler) breaks the e2e dev-server /api/ws proxy —
      # see issue #488. Hold the major until that migration lands; minor/patch
      # on v6 still flow through dev-minor-patch.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
    groups:
      # Keep react + react-dom + their types in lock-step.
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-router"
          - "react-router-*"
      # Test infra tends to ship coordinated breaking changes; bundle it.
      testing:
        patterns:
          - "msw"
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/*"
          - "playwright"
          - "@axe-core/*"
          - "jsdom"
      linting:
        patterns:
          - "@biomejs/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      # Development-dependency majors that no pattern group above claims
      # (@types/node, fast-check, happy-dom, ...). Without this group each
      # one opens a solo PR and burns a full CI matrix: in 2026-07 the
      # single @types/node 26 bump cost 3 CI runs. Dev-only deps cannot
      # reach users, so the blast radius of bundling them is one red CI.
      # Production majors deliberately stay solo — react-plotly 2->3 and
      # Vite 8 both needed individual verification.
      dev-major:
        dependency-type: "development"
        update-types:
          - "major"
      # Everything else: one weekly PR per production/development split.
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions — majors stay ungrouped so action-setup-style footguns get an isolated PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Python (uv/pip)
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
