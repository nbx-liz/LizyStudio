version: 2
updates:
  # Frontend (npm/pnpm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Delay brand-new releases so breaking patch/minor fixes land upstream first.
    cooldown:
      default-days: 5
      semver-major-days: 14
    ignore:
      # Vite 8 (Rolldown bundler) breaks the e2e dev-server /api/ws proxy —
      # see issue #488. Hold the major until that migration lands; minor/patch
      # on v6 still flow through dev-minor-patch.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
    groups:
      # Keep react + react-dom + their types in lock-step.
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-router"
          - "react-router-*"
      # Test infra tends to ship coordinated breaking changes; bundle it.
      testing:
        patterns:
          - "msw"
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/*"
          - "playwright"
          - "@axe-core/*"
          - "jsdom"
      linting:
        patterns:
          - "@biomejs/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      # Everything else: one weekly PR per production/development split.
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions — majors stay ungrouped so action-setup-style footguns get an isolated PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Python (uv/pip)
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
