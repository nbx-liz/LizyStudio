name: CI

on:
  pull_request:
    branches: [main, develop]

# Cancel superseded runs when a PR receives a new push. Only the latest
# revision's result matters; killing in-flight runs frees runner slots
# and avoids burning compute on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path-change detector. Downstream jobs gate on these outputs so
  # area-isolated PRs can skip irrelevant heavy work.
  #
  # Phase 2 (was: "required checks stay unconditional in Phase 1"). Required
  # checks now participate, but they gate their STEPS, never the job — a
  # skipped job reports no context and GitHub scores a skipped required
  # check as success. Only non-required jobs use a job-level `if:`.
  # Measured motivation: every PR CI run in 2026-07 came from a dependabot
  # npm bump, each paying ~11 min for a backend suite with no backend diff.
  #
  # Filter rules force-run the affected area when:
  #   * source code under the area changes
  #   * shared metadata (pyproject.toml, uv.lock, package.json) changes
  #   * a shared shell/python script under scripts/ changes
  #   * any workflow file changes (safety net against rule bugs)
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'src/lizystudio/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'scripts/**'
              # Any workflow edit, not just ci.yml: tests/regression/
              # test_nightly_streak_monitor.py asserts on the *contents* of
              # nightly-streak-monitor.yml, so a change there must reach the
              # backend suite that runs it.
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '!frontend/README.md'
              - 'scripts/**'
              - '.github/workflows/**'

  # Phase 2 of the path-filter rollout. `backend (3.10)` / `backend (3.11)`
  # are REQUIRED status checks, so the job itself must always run and
  # report — a skipped job never reports its context and would block the
  # PR forever. Only the expensive STEPS are gated, which drops a
  # frontend-only PR (every dependabot npm bump) from ~5 min to the
  # 1-minute job floor.
  #
  # Two fail-safes guard the required checks against the silent-pass class:
  #
  #   1. `if: !cancelled()` — a job with `needs:` is SKIPPED when its
  #      dependency fails, and GitHub counts a skipped required check as
  #      SUCCESS. Without this, a broken `changes` job would let a PR merge
  #      with the whole backend suite never executed. `!cancelled()` runs
  #      the job anyway (but still honours concurrency cancellation), and an
  #      unset output then falls through to rule 2.
  #   2. `!= 'false'`, never `== 'true'` — if paths-filter emits an empty
  #      output, `== 'true'` would report green having run nothing.
  #      `!= 'false'` fails safe by running the suite.
  backend:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        if: needs.changes.outputs.backend != 'false'
        with:
          enable-cache: true
      - run: uv sync
        if: needs.changes.outputs.backend != 'false'
      # Lint / format / type-check are Python-version-independent. Run them
      # only on the 3.11 matrix leg so the 3.10 leg does not duplicate
      # ~18s of work. `backend (3.11)` stays the required check that
      # gates them in the branch-protection ruleset.
      - run: uv run ruff check .
        if: needs.changes.outputs.backend != 'false' && matrix.python-version == '3.11'
      - run: uv run ruff format --check .
        if: needs.changes.outputs.backend != 'false' && matrix.python-version == '3.11'
      - run: uv run mypy src/lizystudio/
        if: needs.changes.outputs.backend != 'false' && matrix.python-version == '3.11'
      # Flaky-test strategy (Issue #29): CI reruns failures twice.
      # Local runs do NOT retry so flakiness stays visible. Quarantined
      # tests are excluded from this blocking job (default addopts in
      # pyproject.toml) and run separately in `backend-quarantine`.
      # Integration tests (P-0095) live in their own job; ignore the
      # directory here so we do not double-run a 14s suite on every PR.
      - run: uv run pytest --ignore=tests/integration --cov=src/lizystudio --cov-report=term-missing --cov-fail-under=80 --reruns 2 --reruns-delay 1 -q
        if: needs.changes.outputs.backend != 'false'
      - name: Report skip reason
        if: needs.changes.outputs.backend == 'false'
        run: echo "::notice::No backend-relevant paths changed — suite skipped by the ci.yml path filter."

  # Non-blocking quarantine job — captures signal on tests marked
  # `@pytest.mark.quarantine` without failing the PR. Skip cleanly when
  # no tests carry the marker.
  #
  # Path-filtered: docs-only / frontend-only PRs skip
  # this job. Non-required, so a skipped run cannot affect mergeability.
  backend-quarantine:
    needs: changes
    # Same fail-safe polarity as the required jobs: a broken `changes` job
    # must not silently disable this gate (DC4 — inert wiring).
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - name: Run quarantined tests (non-blocking)
        run: |
          set +e
          COUNT=$(uv run pytest -m quarantine --collect-only -q 2>/dev/null | grep -c "::" || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "::notice::No quarantined tests found — skipping."
            exit 0
          fi
          echo "::notice::Running $COUNT quarantined test(s)."
          uv run pytest -m quarantine --reruns 2 --reruns-delay 1 -q
          # Intentionally swallow non-zero exit — continue-on-error
          # already tolerates failure, but the job status will still be
          # marked green in GitHub UI via continue-on-error.

  # Backend fit -> save -> load round-trip integration tests (P-0095 /
  # Issue #346 Phase C). Real LizyMLAdapter is exercised end-to-end
  # against the captured fixture configs so shape-evolution bugs of
  # the Issue #345 class are caught before merge. Runs in its own job
  # so the ~14s suite parallelises with `backend (3.10)/(3.11)` and
  # does not inflate their wall time. Required check (configure in
  # GitHub branch protection alongside backend / frontend / e2e).
  #
  # Required check — job always runs, steps are path-gated (see `backend`
  # for the two fail-safes).
  integration:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        if: needs.changes.outputs.backend != 'false'
        with:
          enable-cache: true
      - run: uv sync
        if: needs.changes.outputs.backend != 'false'
      - run: uv run pytest tests/integration -v --reruns 2 --reruns-delay 1
        if: needs.changes.outputs.backend != 'false'
      - name: Report skip reason
        if: needs.changes.outputs.backend == 'false'
        run: echo "::notice::No backend-relevant paths changed — integration suite skipped by the ci.yml path filter."

  # P-0103 v3-25b / R-4.1: format_version migration matrix gate. Runs
  # the runtime-fixture matrix (`test_format_version_migration_matrix`)
  # AND the captured-fixture round-trip
  # (`test_legacy_workspace_fixtures`) on every PR so a structural
  # bump cannot ship without:
  #
  # 1. updating the migration chain in `lizystudio.storage.migrations`
  # 2. adding a fixture under `tests/fixtures/legacy_workspaces/v<N>/`
  #
  # The same tests already run inside the `backend` job; this dedicated
  # job exists for observability — a red `format-version-matrix` check
  # tells the reviewer the failure is in the storage compat surface,
  # not the broader regression suite. Required check (configure in
  # branch protection alongside backend / frontend / e2e).
  #
  # Path-filtered: docs-only / frontend-only PRs skip
  # this job. Despite the comment above, this job is NOT currently in
  # the `Protect main` ruleset's required list (verified 2026-05-23) —
  # safe to gate.
  format-version-matrix:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: |
          uv run pytest \
            tests/regression/test_format_version_migration_matrix.py \
            tests/regression/test_legacy_workspace_fixtures.py \
            tests/test_storage_versions.py \
            -v --reruns 2 --reruns-delay 1

  # Required check — job always runs, steps are path-gated (see `backend`
  # for the two fail-safes).
  frontend:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # #456 L3 / failure mode M4: fail fast if a committed visual golden
      # lives under a Playwright project no CI workflow exercises (the
      # chromium-mobile orphan cleaned in #455 was found by accident). Pure
      # git/shell — runs in seconds, no extra runner.
      - name: Check for orphan visual goldens
        if: needs.changes.outputs.frontend != 'false'
        working-directory: .
        run: bash scripts/check_orphan_goldens.sh
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.frontend != 'false'
        with:
          node-version: "20"
      - name: Enable corepack and activate pnpm from packageManager field
        if: needs.changes.outputs.frontend != 'false'
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.frontend != 'false'
      - run: pnpm check
        if: needs.changes.outputs.frontend != 'false'
      - run: pnpm build
        if: needs.changes.outputs.frontend != 'false'
      - run: pnpm vitest run --coverage
        if: needs.changes.outputs.frontend != 'false'
      - name: Report skip reason
        if: needs.changes.outputs.frontend == 'false'
        run: echo "::notice::No frontend-relevant paths changed — suite skipped by the ci.yml path filter."

  # Post-Refactor E2E Gate (CLAUDE.md common/development-workflow.md §3.5).
  # Runs the functional Playwright suite on every PR so structural
  # refactors cannot silently break integration-level flows. Visual
  # regression (@visual) and accessibility scans (@a11y) are EXCLUDED
  # here — they are state-sensitive and live on Nightly so they do not
  # block feature PRs on environment noise.
  #
  # The suite is split into 4 shards (`--shard=N/4`). Each shard is a
  # separate runner with its own backend process, so the single-worker
  # state-isolation guarantee (one backend owns one /tmp workspace) is
  # preserved — sharding does NOT weaken isolation, unlike raising
  # `workers`. Per-shard names are `e2e-shard (N)`; the `e2e-chromium`
  # aggregation job below keeps the stable required-check name.
  e2e-shard:
    name: e2e-shard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Enable corepack and activate pnpm from packageManager field
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version
      - name: Install backend deps
        working-directory: .
        run: uv sync
      - run: pnpm install --frozen-lockfile
      # Build static assets so the backend's SPA fallback is mounted
      # (server.py gates the mount on ``STATIC_DIR/index.html`` existing).
      # Without this the \`security-fixes\` spec — which expects /../ path
      # traversal on :8501 to resolve to the SPA 200 / index.html — sees
      # a FastAPI default 404 instead.
      - run: pnpm build
      # Cache the downloaded browser binaries across runs keyed on the
      # pnpm lockfile (Playwright version is pinned via @playwright/test
      # in package.json → frozen-lockfile guarantees reproducibility).
      - name: Get Playwright version
        id: pw-version
        run: |
          VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run functional E2E (chromium, excluding @visual / @a11y)
        env:
          CI: "true"
          LIZYSTUDIO_FILES_ROOT: /tmp
          LIZYSTUDIO_JOBS_DIR: /tmp/e2e_jobs
        run: |
          rm -rf /tmp/e2e_jobs
          # --ignore-snapshots skips ``toHaveScreenshot`` assertions that
          # live inside functional specs (e.g. workspace-ui-improvements,
          # inference-flow).  Those assertions are covered by the
          # dedicated Nightly visual job; running them here would red-up
          # PRs whenever the committed golden is missing or stale.
          # --shard splits the suite across 4 runners; Playwright
          # distributes tests round-robin so each shard runs ~1/4.
          pnpm exec playwright test \
            --project=chromium \
            --grep-invert="@visual|@a11y|@ci-flaky" \
            --ignore-snapshots \
            --shard=${{ matrix.shard }}/4
      - name: Upload Playwright traces/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Per-shard artifact name — a bare name would collide across
          # the matrix legs and fail the upload.
          name: playwright-report-chromium-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Aggregation gate. Branch-protection ruleset "Protect main" lists
  # `e2e-chromium` as a required status check; after the shard split the
  # matrix job reports per-shard names instead. This job keeps the stable
  # `e2e-chromium` check green only when every shard passed.
  e2e-chromium:
    runs-on: ubuntu-latest
    needs: [e2e-shard]
    if: always()
    steps:
      - name: Verify all E2E shards passed
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "::error::One or more E2E shards failed (result: ${{ needs.e2e-shard.result }})"
            exit 1
          fi
          echo "All E2E shards passed."

  # B-9 Part 2 (H-0078 follow-up): guard against raw Tailwind color
  # utilities in frontend source. After the semantic-token migration
  # (design-tokens.css + tailwind.config.ts), classes like ``bg-green-100``
  # / ``text-red-600`` bypass dark-mode inversion and the WCAG-audited
  # palette. Biome has no Tailwind plugin, so a grep-based check is the
  # cheapest guard. Allowlist lives inside the script.
  raw-color-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan frontend/src for raw Tailwind color classes
        working-directory: frontend
        run: bash scripts/check-raw-colors.sh

  # C-6 Phase 5 (H-0080): guard against reintroduction of the retired
  # ``apiFetch`` helper. After migrating files/inference/workspace/jobs
  # to the openapi-fetch-based ``apiClient``, the old hand-rolled fetcher
  # was removed from client.ts. This grep check makes sure a future
  # change (copy-paste from an old branch, port from another project)
  # cannot silently reintroduce it.
  no-apifetch-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan frontend/src for retired apiFetch usage
        working-directory: frontend
        run: bash scripts/check-no-apifetch.sh

  # Issue #537: the v0.6.2 Target-select bug cluster passed the unit suite
  # because assertions checked that a mock was called, not how many times.
  # This grep guard stops a new bare ``.toHaveBeenCalled()`` from landing —
  # callback assertions must use the count-precise ``.toHaveBeenCalledTimes(N)``.
  #
  # Path-filtered: docs-only / backend-only PRs skip
  # this job. Non-required, so a skipped run cannot affect mergeability.
  tohavebeencalled-guard:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan frontend/src test files for bare .toHaveBeenCalled()
        working-directory: frontend
        run: bash scripts/check-tohavebeencalled.sh

  # C-1 / INV-CI-1: committed schema.d.ts must match freshly-generated
  # output. Prevents drift between backend response_model declarations
  # and the TypeScript types that the frontend compiles against.
  api-types-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Enable corepack + pnpm
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare --activate
      - run: uv sync
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Dump backend OpenAPI schema
        run: |
          uv run python -c "import json; from lizystudio.server import create_app; print(json.dumps(create_app().openapi()))" > /tmp/openapi.json
      - name: Regenerate TypeScript schema from dumped OpenAPI
        working-directory: frontend
        run: node_modules/.bin/openapi-typescript /tmp/openapi.json -o src/api/generated/schema.d.ts
      - name: Fail if schema.d.ts drifted
        run: |
          if ! git diff --exit-code frontend/src/api/generated/schema.d.ts; then
            echo "::error::Committed schema.d.ts is out of date. Run 'cd frontend && pnpm generate:api' and commit."
            exit 1
          fi
