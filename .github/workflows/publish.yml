name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    env:
      # Prevent local version identifiers (e.g. +dirty, +dN.gHASH)
      # even if the working tree becomes dirty during the build.
      # See: https://setuptools-scm.readthedocs.io/en/stable/config/#local-scheme
      SETUPTOOLS_SCM_NO_LOCAL: "1"
    steps:
      # Fetch full history and tags so hatch-vcs can resolve the version
      # from the tag that triggered this workflow.
      # NOTE: actions/checkout@v6 requires explicit fetch-tags: true.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Enable corepack and activate pnpm from packageManager field
        run: |
          corepack enable
          (cd frontend && corepack prepare --activate && pnpm --version)

      # Backend: install, lint, test
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run mypy src/lizystudio/

      # Frontend: install and build into src/lizystudio/static/
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm build

      # Build the Python package.
      # _version.py is auto-generated by hatch-vcs and not tracked in git,
      # so no dirty-state workaround is needed.
      # #456 L4 / failure mode M5: wipe dist/ first so a stale wheel cannot
      # co-reside with the fresh build — the version-verification step below
      # does `ls dist/*.whl | head -1`, which would pick the wrong (older)
      # wheel and fail the tag check if two generations were present.
      - run: rm -rf dist/
      - run: uv build

      # Verify the built version matches the pushed tag (e.g. v0.1.0 → 0.1.0).
      # Catches misconfigured tags or version resolution failures before upload.
      - name: Verify package version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(ls dist/*.whl | head -1 | sed 's/.*-\([0-9][^-]*\)-.*/\1/')
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: tag=$TAG_VERSION package=$PKG_VERSION"
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
