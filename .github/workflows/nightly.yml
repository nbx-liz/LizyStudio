name: Nightly

# Runs the full check suite against develop every night so transitive
# breakage (e.g. a dependency combination that only fails when multiple
# dependabot PRs are merged) is caught without waiting for the next PR.

on:
  schedule:
    - cron: "0 17 * * *" # 02:00 JST
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/lizystudio/
      # Nightly uses the same flaky-retry policy as CI (Issue #29).
      - run: uv run pytest --cov=src/lizystudio --cov-report=term-missing --cov-fail-under=80 --reruns 2 --reruns-delay 1 -q

  bench:
    # Issue #27 (a) / P-0094: capture a perf baseline (mean / stddev) for
    # the LizyML adapter fit cycle on a 100k-row synthetic CSV. The bench
    # is excluded from PR CI by ``--benchmark-skip`` in pyproject.toml's
    # addopts; this job overrides with ``--benchmark-only`` so only the
    # bench file runs. The JSON output is uploaded as an artefact for
    # manual inspection. A future Proposal can add automatic regression
    # detection by comparing across runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync
      - name: Run benchmark
        run: |
          uv run pytest tests/bench/ \
            --benchmark-only \
            --benchmark-json=bench-result.json
      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-result-${{ github.run_id }}
          path: bench-result.json
          retention-days: 90
          if-no-files-found: error

  pickle-compat:
    # v3-26 (R-4.2): cross-minor lizyml pickle compatibility matrix.
    # Every lizyml minor bump invalidates older checkpoints (internal
    # class moves invalidate pickled state). The runtime check in
    # ``verify_pickle_compatibility`` REJECTS such artefacts with a
    # structured ``PICKLE_INCOMPATIBLE`` envelope (kind +
    # recovery_hint + suggested_fix, P-0107). This nightly gate
    # confirms that invariant against the previous three lizyml
    # minor releases — silent load against an older minor is a
    # regression of the v0.5 Exit Criteria (format/pickle compat).
    #
    # ``--benchmark-skip`` from pyproject.toml's addopts keeps the
    # ``tests/bench/`` directory out of the default selection; we run
    # this file by path so the marker-based selection is enough.
    name: Pickle compatibility matrix (v3-26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync
      - name: Run synthetic-drift unit gate
        # The in-process tests rewrite ``model_meta.json`` to simulate
        # past minor saves; they are fast and run before the venv
        # matrix so a structural regression fails the job immediately.
        run: |
          uv run pytest tests/bench/test_bench_pickle_compat.py \
            -m pickle_compat \
            --override-ini="addopts=" \
            -q
      - name: Cross-minor lizyml matrix
        # Provisions ephemeral venvs with the N-1, N-2, N-3 lizyml
        # minors, saves a checkpoint with each, then verifies the
        # runtime rejects them with the structured envelope.
        env:
          PAST_VERSIONS: "0.12.0 0.13.0 0.14.0"
        run: bash scripts/pickle_compat_matrix.sh

  plotly-cdn:
    name: Plotly CDN reachability & SRI freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - name: Verify CDN bundle is reachable and SRI hash matches
        run: |
          set -euo pipefail
          # Extract pinned version and SRI from the source of truth
          VERSION=$(grep '_PLOTLY_VERSION = ' src/lizystudio/services/export.py \
            | head -1 | sed 's/.*"\(.*\)".*/\1/')
          EXPECTED_SRI=$(grep '_PLOTLY_SRI = ' src/lizystudio/services/export.py \
            | head -1 | sed 's/.*"\(.*\)".*/\1/')
          URL="https://cdn.plot.ly/${VERSION}"
          echo "Fetching ${URL} ..."
          # Download the bundle (fail loudly on non-200)
          curl -fsSL -o /tmp/plotly-bundle.js "${URL}"
          echo "✓ CDN returned 200"
          # Compute the actual SRI hash (sha384, base64)
          ACTUAL_HASH=$(openssl dgst -sha384 -binary /tmp/plotly-bundle.js | openssl base64 -A)
          ACTUAL_SRI="sha384-${ACTUAL_HASH}"
          echo "Expected: ${EXPECTED_SRI}"
          echo "Actual:   ${ACTUAL_SRI}"
          if [ "${EXPECTED_SRI}" != "${ACTUAL_SRI}" ]; then
            echo "::error::SRI hash mismatch! The CDN bundle has changed since the hash was pinned."
            echo "Recompute with: curl -fsSL ${URL} | openssl dgst -sha384 -binary | openssl base64 -A"
            exit 1
          fi
          echo "✓ SRI hash matches"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Enable corepack and activate pnpm from packageManager field
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm vitest run --coverage

  # Visual regression + a11y scans run on Nightly only — they are
  # state- and environment-sensitive (jobs_dir seeding, axe-core rule
  # drift), so gating PRs on them would red-up work that has nothing
  # to do with styling/a11y. ``continue-on-error`` keeps the run
  # informational for now; flip it off once the screenshots and a11y
  # backlog are clean.
  e2e-visual-a11y:
    name: E2E visual + a11y (Nightly, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Enable corepack and activate pnpm from packageManager field
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version
      - name: Install backend deps
        working-directory: .
        run: uv sync
      - run: pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: pw-version
        run: |
          VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run visual + a11y E2E
        env:
          CI: "true"
          LIZYSTUDIO_FILES_ROOT: /tmp
          LIZYSTUDIO_JOBS_DIR: /tmp/e2e_jobs
        run: |
          rm -rf /tmp/e2e_jobs
          pnpm exec playwright test \
            --project=chromium \
            --grep="@visual|@a11y"
      - name: Upload Playwright traces/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-a11y
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  mutation-test:
    # Issue #539 Phase 1: mutation testing for the JobStore state
    # machine (backend) + useConfigWriteFunnel (frontend). The score is
    # a TREND METRIC, not a PR gate — ``continue-on-error: true`` keeps
    # this job non-blocking. Tightening per module is tracked via
    # follow-up issues once the baseline lands.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install Python deps
        run: uv sync
      - name: Run mutmut on JobStore state-machine modules
        # ``run`` may report a non-zero exit when mutations survive;
        # we still want the report uploaded, so swallow the exit and
        # write the summary to a fixed path.
        run: |
          uv run mutmut run || true
          uv run mutmut results > .mutmut-results.txt 2>&1 || true
          echo "----- mutmut summary -----"
          cat .mutmut-results.txt || true
      - name: Upload mutmut artefact
        uses: actions/upload-artifact@v7
        with:
          name: mutmut-results
          path: |
            .mutmut-results.txt
            .mutmut-cache/
          if-no-files-found: ignore
          retention-days: 14
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run stryker on useConfigWriteFunnel
        working-directory: frontend
        run: pnpm mutation:test || true
      - name: Upload stryker artefact
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report
          path: |
            frontend/reports/
            frontend/stryker-report.html
          if-no-files-found: ignore
          retention-days: 14
