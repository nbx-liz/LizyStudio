name: Nightly

# Runs the full check suite against develop every night so transitive
# breakage (e.g. a dependency combination that only fails when multiple
# dependabot PRs are merged) is caught without waiting for the next PR.

on:
  schedule:
    - cron: "0 17 * * *" # 02:00 JST
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/lizystudio/
      - run: uv run pytest --cov=src/lizystudio --cov-report=term-missing --cov-fail-under=80 -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm check
      - run: cd frontend && pnpm build
      - run: cd frontend && pnpm vitest run --coverage
